name: Android cancellation check

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/src/main/java/dev/exactrpn/CalculationService.java'
      - 'app/src/main/java/dev/exactrpn/RemoteCalculator.java'
      - 'app/src/main/java/dev/exactrpn/CalculatorStore.java'
      - 'app/src/androidTest/**'
      - '.github/workflows/device-checks.yml'

permissions:
  contents: read

concurrency:
  group: device-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cancellation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify cancellation and recovery on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          script: gradle --no-daemon --console=plain :app:connectedDebugAndroidTest
      - name: Upload device test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cancellation-test-report
          path: app/build/reports/androidTests/connected/
          if-no-files-found: ignore
