name: Android cancellation check

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/src/main/java/**'
      - 'engine/src/main/java/dev/exactrpn/**'
      - 'app/src/androidTest/**'
      - 'test-support/**'
      - 'app/src/main/res/**'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/build.gradle'
      - 'gradle.properties'
      - 'scripts/test-device.sh'
      - '.github/workflows/device-checks.yml'
  pull_request:
    paths:
      - 'app/src/main/java/**'
      - 'engine/src/main/java/dev/exactrpn/**'
      - 'app/src/androidTest/**'
      - 'test-support/**'
      - 'app/src/main/res/**'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/build.gradle'
      - 'gradle.properties'
      - 'scripts/test-device.sh'
      - '.github/workflows/device-checks.yml'

permissions:
  contents: read

concurrency:
  group: device-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cancellation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            target: default
          - api: 29
            target: default
          - api: 35
            target: google_apis
          - api: 36
            target: google_apis
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.11.1'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify cancellation and recovery on Android
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.target }}
          # Android 8 System UI assumes a navigation bar when a lock-screen app opens.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -prop qemu.hw.mainkeys=0
          disable-animations: true
          script: |
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            bash scripts/test-device.sh
      - name: Upload device test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-test-report-${{ matrix.api }}
          path: app/build/reports/device-tests/
          if-no-files-found: ignore
