name: Android cancellation check

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/src/main/java/**'
      - 'engine/src/main/java/dev/exactrpn/**'
      - 'app/src/androidTest/**'
      - 'test-support/**'
      - 'app/src/main/res/**'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/build.gradle'
      - 'gradle.properties'
      - 'scripts/test-device.sh'
      - '.github/workflows/device-checks.yml'

permissions:
  contents: read

concurrency:
  group: device-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cancellation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            target: default
          - api: 29
            target: default
          - api: 35
            target: google_apis
          - api: 36
            target: google_apis
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.11.1'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify cancellation and recovery on Android
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.target }}
          # Android 8 System UI assumes a navigation bar when a lock-screen app opens.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -prop qemu.hw.mainkeys=0
          disable-animations: true
          script: |
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            bash scripts/test-device.sh "${{ matrix.api }}"
      - name: Upload device test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: device-test-report-${{ matrix.api }}
          path: app/build/reports/device-tests/
          if-no-files-found: ignore
