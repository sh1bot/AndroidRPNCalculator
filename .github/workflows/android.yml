name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test engine and build APK and app bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      permanent_signing: ${{ steps.trusted_build.outputs.permanent_signing }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Install Android build packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.11.1'

      - name: Check phone-install script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/install-latest.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors) { $parseErrors | ForEach-Object { Write-Error $_ }; exit 1 }
          ./scripts/test-install-latest.ps1

      - name: Check upstream source integrity
        run: sha256sum -c licenses/SHA256SUMS

      - name: Build trusted main branch (permanent signing when configured)
        id: trusted_build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            : "${ANDROID_KEYSTORE_PASSWORD:?Missing keystore password}"
            : "${ANDROID_KEY_ALIAS:?Missing key alias}"
            : "${ANDROID_KEY_PASSWORD:?Missing key password}"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/androidrpn-signing.p12"
            trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
            umask 077
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
            echo "Signing with the permanent key configured in repository secrets."
            echo "permanent_signing=true" >> "$GITHUB_OUTPUT"
            gradle --no-daemon --console=plain :engine:regression :app:assembleRelease :app:bundleRelease
            cp app/build/outputs/apk/release/app-release.apk dist/ExactRPN.apk
            cp app/build/outputs/bundle/release/app-release.aab dist/ExactRPN.aab
          else
            if [[ -n "$ANDROID_KEYSTORE_PASSWORD$ANDROID_KEY_ALIAS$ANDROID_KEY_PASSWORD" ]]; then
              echo "::error::Signing secrets are incomplete: ANDROID_KEYSTORE_BASE64 is missing."
              exit 1
            fi
            gradle --no-daemon --console=plain :engine:regression :app:assembleDebug :app:bundleDebug
            cp app/build/outputs/apk/debug/app-debug.apk dist/ExactRPN.apk
            cp app/build/outputs/bundle/debug/app-debug.aab dist/ExactRPN.aab
            echo "::warning::No permanent signing key configured. This build uses a temporary debug key; in-place updates across builds will fail."
          fi

      - name: Build other branches and pull requests without signing secrets
        if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
        run: |
          gradle --no-daemon --console=plain :engine:regression :app:assembleDebug :app:bundleDebug
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ExactRPN.apk
          cp app/build/outputs/bundle/debug/app-debug.aab dist/ExactRPN.aab

      - name: Verify APK signature and record checksum
        env:
          PERMANENT_SIGNING: ${{ steps.trusted_build.outputs.permanent_signing }}
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/ExactRPN.apk
          sha256sum dist/ExactRPN.apk
          if [[ "$PERMANENT_SIGNING" == "true" ]]; then
            badging=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/ExactRPN.apk)
            if [[ "$badging" == *application-debuggable* ]]; then
              echo "::error::Published APK must not be debuggable."
              exit 1
            fi
          fi

      - name: Verify app bundle signature
        run: |
          python3 - <<'PYTHON'
          import zipfile
          with zipfile.ZipFile("dist/ExactRPN.aab") as bundle:
              entries = bundle.namelist()
              assert "BundleConfig.pb" in entries, "Not an Android App Bundle"
              assert any(name.startswith("META-INF/") and name.endswith(".SF") for name in entries), "Unsigned app bundle"
              assert any(name.startswith("META-INF/") and name.endswith((".RSA", ".DSA", ".EC")) for name in entries), "Missing app bundle signature"
          PYTHON
          jarsigner -verify dist/ExactRPN.aab
          sha256sum dist/ExactRPN.aab

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ExactRPN
          path: dist/ExactRPN.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload app bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ExactRPN-bundle
          path: dist/ExactRPN.aab
          if-no-files-found: error
          retention-days: 30


  publish:
    name: Publish latest development release
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.outputs.permanent_signing == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download verified APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ExactRPN
          path: dist

      - name: Download verified app bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ExactRPN-bundle
          path: dist

      - name: Update rolling development release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v0.1-dev.$BUILD_NUMBER"
          (cd dist && sha256sum ExactRPN.apk ExactRPN.aab > SHA256SUMS.txt)
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Latest development build from main.
          Commit: $BUILD_SHA

          Download **ExactRPN.apk** to install or update. **ExactRPN.aab** is the app bundle for uploading to Google Play, not direct installation. Both are signed with the project's permanent key.
          EOF
          # Keep one release entry, but advance its version tag so Obtainium detects updates.
          current_tag=$(gh api --paginate --slurp "repos/$GH_REPO/releases" | jq -r '[.[][] | select(.name == "Latest development build")][0].tag_name // empty')
          if [[ -z "$current_tag" ]]; then
            current_tag="$tag"
            gh release create "$tag" --target "$BUILD_SHA" --title "Latest development build" --draft --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$current_tag" dist/ExactRPN.apk dist/ExactRPN.aab dist/SHA256SUMS.txt --clobber
          gh release edit "$current_tag" --tag "$tag" --target "$BUILD_SHA" --title "Latest development build" --notes-file "$RUNNER_TEMP/release-notes.md" --draft=false --latest
