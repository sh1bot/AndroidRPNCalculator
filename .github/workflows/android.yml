name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Stable release version (leave empty for a development build)'
        required: false
        type: string

env:
  RELEASE_VERSION: ${{ inputs.release_version }}

permissions:
  actions: read
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test engine and build APK and app bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      permanent_signing: ${{ steps.trusted_build.outputs.permanent_signing }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Install Android build packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.11.1'

      - name: Check phone-install script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/install-latest.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors) { $parseErrors | ForEach-Object { Write-Error $_ }; exit 1 }
          ./scripts/test-install-latest.ps1

      - name: Check upstream source integrity
        run: sha256sum -c licenses/SHA256SUMS

      - name: Build trusted main branch (permanent signing when configured)
        id: trusted_build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PRIVACY_CONTACT_EMAIL: ${{ secrets.PRIVACY_CONTACT_EMAIL }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # Record a public-input, unsigned release before introducing either
          # the signing key or the private contact address. This is directly
          # comparable with the unsigned release built for pull requests.
          env \
            -u ANDROID_KEYSTORE_PATH \
            -u ANDROID_KEYSTORE_PASSWORD \
            -u ANDROID_KEY_ALIAS \
            -u ANDROID_KEY_PASSWORD \
            -u PRIVACY_CONTACT_EMAIL \
            gradle --no-daemon --console=plain :engine:regression :app:assembleRelease :app:bundleRelease
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib
          apk = pathlib.Path("app/build/outputs/apk/release/app-release-unsigned.apk")
          pathlib.Path("dist/unsigned-apk-size.json").write_text(json.dumps({
              "bytes": apk.stat().st_size,
              "commit": os.environ["GITHUB_SHA"],
              "sha256": hashlib.sha256(apk.read_bytes()).hexdigest(),
          }, indent=2) + "\n")
          PYTHON
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            : "${ANDROID_KEYSTORE_PASSWORD:?Missing keystore password}"
            : "${ANDROID_KEY_ALIAS:?Missing key alias}"
            : "${ANDROID_KEY_PASSWORD:?Missing key password}"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/androidrpn-signing.p12"
            trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
            umask 077
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
            echo "Signing with the permanent key configured in repository secrets."
            echo "permanent_signing=true" >> "$GITHUB_OUTPUT"
            gradle --no-daemon --console=plain :app:assembleRelease :app:bundleRelease
            cp app/build/outputs/apk/release/app-release.apk dist/ExactRPN.apk
            cp app/build/outputs/bundle/release/app-release.aab dist/ExactRPN.aab
          else
            if [[ -n "$ANDROID_KEYSTORE_PASSWORD$ANDROID_KEY_ALIAS$ANDROID_KEY_PASSWORD" ]]; then
              echo "::error::Signing secrets are incomplete: ANDROID_KEYSTORE_BASE64 is missing."
              exit 1
            fi
            cp app/build/outputs/apk/release/app-release-unsigned.apk dist/ExactRPN.apk
            cp app/build/outputs/bundle/release/app-release.aab dist/ExactRPN.aab
            echo "::warning::No permanent signing key configured. Artifacts are intentionally unsigned and will not be published."
          fi

      - name: Build unsigned pull requests and other branches
        if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
        run: |
          gradle --no-daemon --console=plain :engine:regression :app:assembleRelease :app:bundleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/ExactRPN.apk
          cp app/build/outputs/bundle/release/app-release.aab dist/ExactRPN.aab

      - name: Find latest successful main size baseline
        id: main_size
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          run_id=$(gh api "repos/$GH_REPO/actions/workflows/android.yml/runs?branch=main&status=success&per_page=20" \
            --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")][0].id // empty')
          if [[ -z "$run_id" ]]; then
            echo "::error::No successful main workflow run is available for the APK size comparison."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download latest main size baseline
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ExactRPN-size-baseline
          path: size-baseline
          github-token: ${{ github.token }}
          run-id: ${{ steps.main_size.outputs.run_id }}

      - name: Compare unsigned APK size with main
        if: github.event_name == 'pull_request'
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib
          baseline = json.loads(pathlib.Path("size-baseline/unsigned-apk-size.json").read_text())
          current = pathlib.Path("dist/ExactRPN.apk").stat().st_size
          delta = current - baseline["bytes"]
          percent = delta * 100 / baseline["bytes"]
          comparison = "larger than" if delta > 0 else "smaller than" if delta < 0 else "the same size as"
          summary = os.environ["GITHUB_STEP_SUMMARY"]
          with open(summary, "a") as out:
              out.write("## Unsigned release APK size\n\n")
              out.write("| Build | Bytes | Change |\n|---|---:|---:|\n")
              out.write(f'| Main (`{baseline["commit"][:12]}`) | {baseline["bytes"]:,} | — |\n')
              out.write(f"| This PR | {current:,} | {delta:+,} ({percent:+.2f}%) |\n")
          message = (f"Unsigned release APK is {current:,} bytes: {abs(delta):,} bytes "
                     f"({abs(percent):.2f}%) {comparison} main {baseline['commit'][:12]}.")
          level = "warning" if delta > 0 else "notice"
          print(f"::{level} title=Unsigned APK size::{message}")
          PYTHON

      - name: Verify APK signing policy and record checksum
        env:
          PERMANENT_SIGNING: ${{ steps.trusted_build.outputs.permanent_signing }}
        run: |
          sha256sum dist/ExactRPN.apk
          if [[ "$PERMANENT_SIGNING" == "true" ]]; then
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/ExactRPN.apk
            badging=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/ExactRPN.apk)
            if [[ "$badging" == *application-debuggable* ]]; then
              echo "::error::Published APK must not be debuggable."
              exit 1
            fi
          elif "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify dist/ExactRPN.apk >/dev/null 2>&1; then
            echo "::error::Untrusted branch and pull-request APKs must remain unsigned."
            exit 1
          else
            echo "Unsigned APK expected for an untrusted build."
          fi

      - name: Require an APK with no requested permissions
        run: |
          permissions=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions dist/ExactRPN.apk)
          printf '%s\n' "$permissions"
          if [[ "$permissions" == *uses-permission* ]]; then
            echo "::error::The calculator must not request any Android permissions."
            exit 1
          fi

      - name: Verify bundled offline licence texts
        run: |
          python3 - <<'PYTHON'
          import pathlib, re, zipfile
          import html
          with zipfile.ZipFile("dist/ExactRPN.apk") as apk:
              assert apk.getinfo("assets/docs.html").compress_type == zipfile.ZIP_DEFLATED
              assert not any(n.endswith(".gzip") for n in apk.namelist())
              document = apk.read("assets/docs.html").decode()
              assert "Your first calculation" in document and "Keyboard" in document
              assert "⇅" in document
              # The bundled licence texts are flowed into paragraphs and
              # their bare URLs wrapped in links, so compare word sequences
              # rather than bytes: each text's words, in order, must appear
              # in the document.
              bundled = " ".join(html.unescape(re.sub(r"<[^>]+>", " ", document)).split())
              def check(source, fragment):
                  assert " ".join(fragment.split()) in bundled, source
              check("NOTICE", pathlib.Path("NOTICE").read_text())
              check("licenses/APACHE-2.0.txt", pathlib.Path("licenses/APACHE-2.0.txt").read_text())
              # CR-COPYRIGHT.txt appends a second copy of the Apache License,
              # which the bundle omits; compare only its own notices.
              cr_lines = pathlib.Path("licenses/CR-COPYRIGHT.txt").read_text().splitlines()
              check("licenses/CR-COPYRIGHT.txt", "\n".join(cr_lines[:next(i for i, line in enumerate(cr_lines) if line.strip() == "Apache License")]))
          PYTHON

      - name: Verify app bundle signing policy
        env:
          PERMANENT_SIGNING: ${{ steps.trusted_build.outputs.permanent_signing }}
        run: |
          python3 - <<'PYTHON'
          import os
          import zipfile
          with zipfile.ZipFile("dist/ExactRPN.aab") as bundle:
              entries = bundle.namelist()
              assert "BundleConfig.pb" in entries, "Not an Android App Bundle"
              signatures = [name for name in entries if name.startswith("META-INF/") and name.endswith((".SF", ".RSA", ".DSA", ".EC"))]
              if os.environ.get("PERMANENT_SIGNING") == "true":
                  assert any(name.endswith(".SF") for name in signatures), "Unsigned app bundle"
                  assert any(name.endswith((".RSA", ".DSA", ".EC")) for name in signatures), "Missing app bundle signature"
              else:
                  assert not signatures, "Untrusted app bundle must remain unsigned"
          PYTHON
          if [[ "$PERMANENT_SIGNING" == "true" ]]; then
            jarsigner -verify dist/ExactRPN.aab
          fi
          sha256sum dist/ExactRPN.aab

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ExactRPN
          path: dist/ExactRPN.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload app bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ExactRPN-bundle
          path: dist/ExactRPN.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned APK size baseline
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ExactRPN-size-baseline
          path: dist/unsigned-apk-size.json
          if-no-files-found: error
          retention-days: 90


  publish:
    name: Publish latest development release
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.outputs.permanent_signing == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download verified APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ExactRPN
          path: dist

      - name: Download verified app bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ExactRPN-bundle
          path: dist

      - name: Update rolling development release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v0.10-dev.$BUILD_NUMBER"
          (cd dist && sha256sum ExactRPN.apk ExactRPN.aab > SHA256SUMS.txt)
          if [[ -n "$RELEASE_VERSION" ]]; then
            [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "Invalid release version"; exit 1; }
            cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Exact RPN $RELEASE_VERSION.

          Exact arithmetic RPN calculator for Android, using Google's arithmetic engine. Includes scientific functions, decimal and fraction display, stack selection, keyboard support, and offline help and licenses.

          Download **ExactRPN.apk** to install or update. **ExactRPN.aab** is for uploading to Google Play. Both use the project's permanent signing key.

          Source commit: $BUILD_SHA
          EOF
            gh release create "v$RELEASE_VERSION" dist/ExactRPN.apk dist/ExactRPN.aab dist/SHA256SUMS.txt --target "$BUILD_SHA" --title "Exact RPN $RELEASE_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" --latest
            exit 0
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Latest development build from main.
          Commit: $BUILD_SHA

          Download **ExactRPN.apk** to install or update. **ExactRPN.aab** is the app bundle for uploading to Google Play, not direct installation. Both are signed with the project's permanent key.
          EOF
          # Keep one release entry, but advance its version tag so Obtainium detects updates.
          current_tag=$(gh api --paginate --slurp "repos/$GH_REPO/releases" | jq -r '[.[][] | select(.name == "Latest development build")][0].tag_name // empty')
          if [[ -z "$current_tag" ]]; then
            current_tag="$tag"
            gh release create "$tag" --target "$BUILD_SHA" --title "Latest development build" --draft --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$current_tag" dist/ExactRPN.apk dist/ExactRPN.aab dist/SHA256SUMS.txt --clobber
          gh release edit "$current_tag" --tag "$tag" --target "$BUILD_SHA" --title "Latest development build" --notes-file "$RUNNER_TEMP/release-notes.md" --draft=false --latest
