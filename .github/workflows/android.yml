name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test engine and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      permanent_signing: ${{ steps.trusted_build.outputs.permanent_signing }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Install Android build packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Check phone-install script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/install-latest.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors) { $parseErrors | ForEach-Object { Write-Error $_ }; exit 1 }

      - name: Check upstream source integrity
        run: sha256sum -c licenses/SHA256SUMS

      - name: Build trusted main branch (permanent signing when configured)
        id: trusted_build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            : "${ANDROID_KEYSTORE_PASSWORD:?Missing keystore password}"
            : "${ANDROID_KEY_ALIAS:?Missing key alias}"
            : "${ANDROID_KEY_PASSWORD:?Missing key password}"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/androidrpn-signing.p12"
            trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
            umask 077
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
            echo "Signing with the permanent key configured in repository secrets."
            echo "permanent_signing=true" >> "$GITHUB_OUTPUT"
          else
            if [[ -n "$ANDROID_KEYSTORE_PASSWORD$ANDROID_KEY_ALIAS$ANDROID_KEY_PASSWORD" ]]; then
              echo "::error::Signing secrets are incomplete: ANDROID_KEYSTORE_BASE64 is missing."
              exit 1
            fi
            echo "::warning::No permanent signing key configured. This build uses a temporary debug key; in-place updates across builds will fail."
          fi
          gradle --no-daemon --console=plain :engine:regression :app:assembleDebug

      - name: Build other branches and pull requests without signing secrets
        if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
        run: gradle --no-daemon --console=plain :engine:regression :app:assembleDebug

      - name: Verify APK signature and record checksum
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ExactRPN-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30


  publish:
    name: Publish latest development release
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.outputs.permanent_signing == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download verified APK
        uses: actions/download-artifact@v4
        with:
          name: ExactRPN-debug
          path: dist

      - name: Update rolling development release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v0.1-dev.$BUILD_NUMBER"
          mv dist/app-debug.apk dist/ExactRPN.apk
          (cd dist && sha256sum ExactRPN.apk > SHA256SUMS.txt)
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Latest development build from main.
          Commit: $BUILD_SHA

          Download **ExactRPN.apk** to install or update. Signed with the project's permanent key.
          EOF
          # Keep one release entry, but advance its version tag so Obtainium detects updates.
          current_tag=$(gh api --paginate --slurp "repos/$GH_REPO/releases" | jq -r '[.[][] | select(.name == "Latest development build")][0].tag_name // empty')
          if [[ -z "$current_tag" ]]; then
            current_tag="$tag"
            gh release create "$tag" --target "$BUILD_SHA" --title "Latest development build" --draft --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$current_tag" dist/ExactRPN.apk dist/SHA256SUMS.txt --clobber
          gh release edit "$current_tag" --tag "$tag" --target "$BUILD_SHA" --title "Latest development build" --notes-file "$RUNNER_TEMP/release-notes.md" --draft=false --latest
