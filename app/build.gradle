plugins { id 'com.android.application' }

// Robolectric's SDK 36 runtime is Java 21 bytecode, so the JVM unit tests
// launch on a 21 toolchain; everything else in the build stays on 17.
def robolectricLauncher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(21)
}
def signingFile = System.getenv('ANDROID_KEYSTORE_PATH')
android {
    namespace 'dev.exactrpn'
    sourceSets.androidTest.java.srcDir rootProject.file('test-support/src/main/java')
    // The same instrumentation sources also run on the JVM under Robolectric
    // (src/test/java holds the Robolectric-only application class). Tests that
    // cannot run under Robolectric are excluded from the unit test task
    // below; connectedAndroidTest still runs everything on a device.
    sourceSets.test.java.srcDirs = ['src/test/java', 'src/androidTest/java', rootProject.file('test-support/src/main/java')]
    compileSdk 36
    defaultConfig {
        applicationId 'dev.exactrpn'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        minSdk 26
        targetSdk 36
        versionCode = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
        versionName = System.getenv('RELEASE_VERSION') ?: (System.getenv('GITHUB_RUN_NUMBER') ? "0.10-dev.${System.getenv('GITHUB_RUN_NUMBER')}" : '0.10-dev')
    }
    signingConfigs {
        if (signingFile) {
            permanent {
                storeFile file(signingFile)
                storeType 'PKCS12'
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        // Nothing reads the version-control-info.textproto entry AGP embeds;
        // in AGP 8.9 vcsInfo is a per-build-type setting.
        debug { vcsInfo.include = false }
        release {
            vcsInfo.include = false
            minifyEnabled true
            shrinkResources true
            // This app has no runtime reflection that needs generic, annotation, or
            // inner-class metadata retained by Android's general-purpose defaults.
            proguardFiles 'proguard-rules.pro'
        }
        if (signingFile) {
            debug { signingConfig signingConfigs.permanent }
            release { signingConfig signingConfigs.permanent }
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions {
        unitTests {
            includeAndroidResources = true
            all { test ->
                test.javaLauncher.set(robolectricLauncher)
                test.maxHeapSize = '1g'
                test.jvmArgs '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
                        '--add-opens', 'java.base/java.lang.reflect=ALL-UNNAMED',
                        '--add-opens', 'java.base/java.io=ALL-UNNAMED',
                        '--add-opens', 'java.base/java.nio=ALL-UNNAMED',
                        '--add-opens', 'java.base/java.util=ALL-UNNAMED',
                        '--add-opens', 'java.base/java.util.regex=ALL-UNNAMED',
                        '--add-opens', 'java.base/java.text=ALL-UNNAMED',
                        '--add-opens', 'java.base/sun.nio.ch=ALL-UNNAMED',
                        '--add-opens', 'java.desktop/java.awt.font=ALL-UNNAMED'
                test.filter {
                    // Device-only: drives UiAutomation shell commands and the
                    // assets generated by generateLicenseAssets.
                    excludeTestsMatching 'dev.exactrpn.AboutTest'
                    // Device-only: its premise is killing the calculation
                    // process, which is a no-op in Robolectric's one process.
                    excludeTestsMatching 'dev.exactrpn.CancellationTest'
                    // Host fonts (not Roboto) and Robolectric's default display
                    // change fit and geometry decisions at the boundary.
                    excludeTestsMatching 'dev.exactrpn.StackSelectionTest.fractionTooWideForOneLineUsesExponentialInsteadOfWrapping'
                    excludeTestsMatching 'dev.exactrpn.AdaptiveKeypadTest.reorderedControlsAndHeldDigitsFollowTheirCurrentRoles'
                    excludeTestsMatching 'dev.exactrpn.AdaptiveKeypadTest.modesStayInsideTheStackAndKeypadUsesFullLandscapeHeight'
                    excludeTestsMatching 'dev.exactrpn.FunctionsTest.stackedFractionUsesTheResolvedTextColour'
                    excludeTestsMatching 'dev.exactrpn.FunctionsTest.dozenalDigitsKeepTheirCharactersAndInstallFontFallbacks'
                    // These drive a live RemoteCalculator through failure and
                    // rebind cycles; the in-process service collapse stalls the
                    // cycle after a failure.
                    excludeTestsMatching 'dev.exactrpn.FunctionsTest.mixedDisplayCopyAndFactorisationThroughRemoteProcess'
                    excludeTestsMatching 'dev.exactrpn.FunctionsTest.remoteValidationUsesTheErrorCatalogue'
                    excludeTestsMatching 'dev.exactrpn.MemoryTransportTest.failedRequestReloadsAcceptedMemoryOnTheNextRequest'
                    excludeTestsMatching 'dev.exactrpn.MemoryTransportTest.failedCopyPreservesBothCachesWithoutResendingTheSnapshot'
                    excludeTestsMatching 'dev.exactrpn.MemoryTransportTest.oversizedCopiesAndRequestsPreserveTheAcceptedCalculation'
                    excludeTestsMatching 'dev.exactrpn.MemoryTransportTest.workerExplicitlyPreservesNoOpDraftsAndRestoresHistoryReplies'
                    excludeTestsMatching 'dev.exactrpn.LockScreenTest.temporaryTransportRejectsFilePathsWithoutReadingSavedState'
                    excludeTestsMatching 'dev.exactrpn.LockScreenTest.temporaryActivityNeverRestoresOrChangesTheSavedCalculation'
                    // These stop or background a session mid-calculation and
                    // wait on timed saves and notice expiry; the in-process
                    // service and the shadow clock change that timing.
                    excludeTestsMatching 'dev.exactrpn.EntryOperatorTest.repeatedUnderflowShowsTheNoticeAgainAfterItExpires'
                    excludeTestsMatching 'dev.exactrpn.EntryOperatorTest.stoppingSavesAcceptedMemoryWithoutWaitingForOrCancellingArithmetic'
                    excludeTestsMatching 'dev.exactrpn.EntryOperatorTest.outstandingWorkUpdatesTheSaveAfterFinishingInBackground'
                }
            }
        }
    }
}
dependencies {
    implementation project(':engine')
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    testImplementation 'org.robolectric:robolectric:4.16'
    testImplementation 'androidx.test:runner:1.6.2'
    testImplementation 'androidx.test.ext:junit:1.2.1'
    testImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}



// Generate offline documents from their authoritative sources. No runtime Markdown dependency.
def licenseAssets = layout.buildDirectory.dir('generated/licenseAssets')
def generateLicenseAssets = tasks.register('generateLicenseAssets') {
    inputs.files(rootProject.file('HELP.md'), rootProject.file('README.md'), rootProject.file('NOTICE'), rootProject.file('licenses/APACHE-2.0.txt'), rootProject.file('licenses/CR-COPYRIGHT.txt'))
    outputs.dir(licenseAssets)
    doLast {
        def escape = { text -> text.replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;') }
        def help = rootProject.file('HELP.md').getText('UTF-8')
        def embedded = help.replaceFirst('# Using Exact RPN', '### Using Exact RPN').replace('\n## ', '\n#### ')
        assert rootProject.file('README.md').getText('UTF-8').contains('<!-- BEGIN HELP -->\n' + embedded + '<!-- END HELP -->'): 'README Use section must match HELP.md'
        def html = help.readLines().collect { line ->
            def match = (line =~ /^(#{1,6}) (.*)$/)
            if (match.matches()) return '<h' + match[0][1].length() + '>' + escape(match[0][2]) + '</h' + match[0][1].length() + '>'
            '<p>' + escape(line).replaceAll(/\*\*(.+?)\*\*/, '<b>$1</b>').replaceAll(/`(.+?)`/, '<tt>$1</tt>') + '</p>'
        }.join('\n')
        // Plain text, shown as-is by AboutDialog: keeping the newlines instead
        // of a <br> per line saves about 1.5 KB in the generated asset.
        def legal = 'Licenses and source credits\n'
        ['Source credits':'NOTICE', 'Apache License 2.0':'licenses/APACHE-2.0.txt', 'Constructive-real library notices':'licenses/CR-COPYRIGHT.txt'].each { title, path ->
            legal += '\n' + title + '\n\n' + rootProject.file(path).getText('UTF-8').strip() + '\n'
        }
        delete licenseAssets
        def directory = licenseAssets.get().asFile
        directory.mkdirs()
        ['help.html':html, 'licenses.html':legal].each { name, content ->
            new File(directory, name).setText(content, 'UTF-8')
        }
    }
}
android.sourceSets.main.assets.srcDir(licenseAssets)
tasks.named('preBuild').configure { dependsOn generateLicenseAssets }
