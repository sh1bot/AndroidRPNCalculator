buildscript {
    repositories { mavenCentral() }
    // Build-time only: converts the project's Markdown documents to HTML.
    // Nothing of it is packaged into the app.
    dependencies { classpath 'org.commonmark:commonmark:0.29.0' }
}

plugins { id 'com.android.application' }
def signingFile = System.getenv('ANDROID_KEYSTORE_PATH')
android {
    namespace 'dev.exactrpn'
    sourceSets.androidTest.java.srcDir rootProject.file('test-support/src/main/java')
    compileSdk 36
    defaultConfig {
        applicationId 'dev.exactrpn'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        minSdk 26
        targetSdk 36
        versionCode = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
        versionName = System.getenv('RELEASE_VERSION') ?: (System.getenv('GITHUB_RUN_NUMBER') ? "0.10-dev.${System.getenv('GITHUB_RUN_NUMBER')}" : '0.10-dev')
    }
    signingConfigs {
        if (signingFile) {
            permanent {
                storeFile file(signingFile)
                storeType 'PKCS12'
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            // This app has no runtime reflection that needs generic, annotation, or
            // inner-class metadata retained by Android's general-purpose defaults.
            proguardFiles 'proguard-rules.pro'
        }
        if (signingFile) {
            debug { signingConfig signingConfigs.permanent }
            release { signingConfig signingConfigs.permanent }
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation project(':engine')
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}



// Generate the app's single offline document from its authoritative sources:
// the README's preamble and Sources section, HELP.md, and the licence texts.
// Markdown is converted at build time (commonmark is a build-only dependency);
// the app ships just the minified HTML and renders it with Android's built-in
// Html.fromHtml, so nothing is added to the APK but the document itself.
def licenseAssets = layout.buildDirectory.dir('generated/licenseAssets')
def generateLicenseAssets = tasks.register('generateLicenseAssets') {
    inputs.files(rootProject.file('README.md'), rootProject.file('HELP.md'), rootProject.file('PRIVACY.md'), rootProject.file('NOTICE'), rootProject.file('licenses/APACHE-2.0.txt'), rootProject.file('licenses/CR-COPYRIGHT.txt'))
    outputs.dir(licenseAssets)
    doLast {
        def parser = org.commonmark.parser.Parser.builder().build()
        def renderer = org.commonmark.renderer.html.HtmlRenderer.builder().build()
        // Html.fromHtml has always understood <tt>; <code> arrived much later.
        def convert = { markdown ->
            renderer.render(parser.parse(markdown)).replace('<code>', '<tt>').replace('</code>', '</tt>')
        }
        def escape = { text -> text.replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;') }

        // Split the README at its '## ' headings. The preamble is the About
        // text; the Build section is for source readers only, and Use just
        // links to HELP.md, whose own text is the usage section below.
        def sections = ['': []]
        def current = ''
        rootProject.file('README.md').readLines().each { line ->
            if (line.startsWith('## ')) {
                current = line.substring(3).trim()
                sections[current] = []
            } else {
                sections[current] << line
            }
        }
        assert sections.containsKey('Sources and license'): 'README.md has no Sources and license section'
        // The APK download link is meaningless inside the app; the source
        // link takes its place.
        def aboutMarkdown = sections[''].findAll { !it.contains('releases/latest/download') }.join('\n')
        def about = convert(aboutMarkdown)
                .replace('<h1>Exact RPN for Android</h1>', '<h1 id="about">Exact RPN for Android</h1>')
        about += '<p>Source code: <a href="https://github.com/sh1bot/AndroidRPNCalculator">github.com/sh1bot/AndroidRPNCalculator</a></p>'

        def help = convert(rootProject.file('HELP.md').getText('UTF-8'))
                .replace('<h1>Using Exact RPN</h1>', '<h1 id="help">Using Exact RPN</h1>')

        // Links to licence files in the repo become links to the bundled
        // licence section below.
        def sources = convert('## Sources and license\n' + sections['Sources and license'].join('\n'))
                .replace('<h2>Sources and license</h2>', '<h1 id="sources">Sources and license</h1>')
                .replace('href="licenses/APACHE-2.0.txt"', 'href="#licenses"')
                .replace('href="licenses/CR-COPYRIGHT.txt"', 'href="#licenses"')
                .replace('href="licenses"', 'href="#licenses"')
                .replace('href="LICENSE"', 'href="#licenses"')
                .replace('href="NOTICE"', 'href="#licenses"')

        // The licence texts are bundled verbatim; the only change is that
        // bare URLs become links. CR-COPYRIGHT.txt appends a full copy of
        // the Apache License to its own notices, and that text is already
        // bundled from licenses/APACHE-2.0.txt, so only the file's own
        // notices are taken from it. The build first verifies, word for
        // word, that the part being left out is that same licence, so
        // nothing unique to the file can be dropped silently.
        def wordsOf = { text -> text.split(/\s+/).findAll { !it.isEmpty() } }
        def apacheLines = rootProject.file('licenses/APACHE-2.0.txt').readLines()
        def apacheTitle = apacheLines.findIndexOf { it.trim() == 'Apache License' }
        def crLines = rootProject.file('licenses/CR-COPYRIGHT.txt').readLines()
        def crTitle = crLines.findIndexOf { it.trim() == 'Apache License' }
        assert apacheTitle >= 0 && crTitle > 0: 'Combined licence files no longer have the expected shape'
        assert wordsOf(crLines[crTitle..-1].join('\n')) == wordsOf(apacheLines[apacheTitle..-1].join('\n')):
                'The Apache License appended to CR-COPYRIGHT.txt differs from licenses/APACHE-2.0.txt'
        def crNotices = crLines[0..<crTitle].join('\n').replaceAll(/\s+$/, '') + '\n'
        // Each text is headed by what it is and where it comes from, so
        // that references inside the texts (to files, or to the directory
        // a library was published in) have their context.
        def legal = '<h1 id="licenses">Licenses and source credits</h1>'
        def addText = { title, framing, text ->
            legal += '<h2>' + title + '</h2><p>' + framing + '</p><p>' + escape(text).replace('\n', '<br>') + '</p>'
        }
        addText('Source credits',
                'The project\u2019s NOTICE file, as it appears in the source repository.',
                rootProject.file('NOTICE').getText('UTF-8'))
        addText('Apache License 2.0',
                'The licence covering this app and the Android Open Source Project code in it, as bundled with that code.',
                rootProject.file('licenses/APACHE-2.0.txt').getText('UTF-8'))
        addText('Constructive-real library notices',
                'The copyright file published with Hans-J. Boehm\u2019s constructive-real library (com.hp.creals); "this directory" in it means the library\u2019s source directory.',
                crNotices)

        // Minify the converted sections: whitespace that sits purely between
        // tags is renderer formatting. The licence texts are exempt: their
        // construction emits no formatting whitespace, and linkifying after
        // this step keeps the indentation of a line that is a single URL.
        def document = (about + help + sources).replaceAll(/(?<=>)\s+(?=<)/, '')
        document += legal.replaceAll(/(https?:\/\/[^\s<]+?)(?=[.,;]?(?:<|\s|$))/, '<a href="$1">$1</a>')

        // The privacy policy closes the document. Its contact token is
        // replaced from the PRIVACY_CONTACT_EMAIL environment variable (a
        // repository secret in CI's trusted build) and entity-encoded, so
        // the raw address never appears in the file; without the variable
        // the line links to the published policy instead. The file's HTML
        // comment is build instructions, not policy text, and is dropped.
        def inComment = false
        def privacyMarkdown = rootProject.file('PRIVACY.md').readLines().findAll { line ->
            if (line.trim().startsWith('<!--')) inComment = true
            boolean keep = !inComment
            if (line.contains('-->')) inComment = false
            keep
        }.join('\n')
        def contactEmail = System.getenv('PRIVACY_CONTACT_EMAIL')
        privacyMarkdown = privacyMarkdown.replace('CONTACT_EMAIL', contactEmail ? contactEmail
                : '[sh1bot.github.io/AndroidRPNCalculator/PRIVACY](https://sh1bot.github.io/AndroidRPNCalculator/PRIVACY.html)')
        def privacy = convert(privacyMarkdown)
                .replace('<h1>Privacy Policy \u2014 Exact RPN</h1>', '<h1 id="privacy">Privacy Policy</h1>')
                .replaceAll(/(?<=>)\s+(?=<)/, '')
        if (contactEmail) {
            def encoded = contactEmail.toCharArray().collect { ch -> '&#' + (int) ch + ';' }.join('')
            privacy = privacy.replace(contactEmail, encoded)
        }
        document += privacy
        delete licenseAssets
        def directory = licenseAssets.get().asFile
        directory.mkdirs()
        new File(directory, 'docs.html').setText(document, 'UTF-8')
    }
}
android.sourceSets.main.assets.srcDir(licenseAssets)
tasks.named('preBuild').configure { dependsOn generateLicenseAssets }

// AGP already runs aapt2 optimize before packaging release resources. Its
// public DSL does not expose resource-name collapsing, so add that final
// optimization to the same pre-signing stage instead of rewriting a signed APK.
tasks.matching { it.name == 'optimizeReleaseResources' }.configureEach {
    outputs.upToDateWhen { false }
    doLast {
        def aapt2 = androidComponents.sdkComponents.sdkDirectory.get().file(
                "build-tools/${android.buildToolsVersion}/aapt2").asFile
        outputs.files.asFileTree.matching { include '**/*.ap_' }.files.each { resources ->
            def optimized = new File(resources.parentFile, resources.name + '.collapsed')
            providers.exec {
                commandLine aapt2, 'optimize', '--collapse-resource-names',
                        '--deduplicate-entry-values', '-o', optimized, resources
            }.result.get().assertNormalExitValue()
            if (optimized.length() < resources.length()) {
                java.nio.file.Files.move(optimized.toPath(), resources.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            } else {
                optimized.delete()
            }
        }
    }
}
