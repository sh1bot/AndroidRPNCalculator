plugins { id 'com.android.application' }
def signingFile = System.getenv('ANDROID_KEYSTORE_PATH')
android {
    namespace 'dev.exactrpn'
    compileSdk 36
    defaultConfig {
        applicationId 'dev.exactrpn'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        minSdk 26
        targetSdk 36
        versionCode = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
        versionName = System.getenv('GITHUB_RUN_NUMBER') ? "0.1-dev.${System.getenv('GITHUB_RUN_NUMBER')}" : '0.1-dev'
    }
    signingConfigs {
        if (signingFile) {
            permanent {
                storeFile file(signingFile)
                storeType 'PKCS12'
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        if (signingFile) {
            debug { signingConfig signingConfigs.permanent }
            release { signingConfig signingConfigs.permanent }
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation project(':engine')
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}



// Keep distributed notices identical to the repository's authoritative copies.
def licenseAssets = layout.buildDirectory.dir('generated/licenseAssets')
def generateLicenseAssets = tasks.register('generateLicenseAssets', Sync) {
    into licenseAssets.map { it.dir('licenses') }
    from(rootProject.file('NOTICE')) { rename { 'NOTICE.txt' } }
    from(rootProject.file('licenses')) {
        include 'APACHE-2.0.txt', 'CR-COPYRIGHT.txt'
    }
}
android.sourceSets.main.assets.srcDir(licenseAssets)
tasks.named('preBuild').configure { dependsOn generateLicenseAssets }
