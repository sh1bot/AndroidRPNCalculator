plugins { id 'com.android.application' }
def signingFile = System.getenv('ANDROID_KEYSTORE_PATH')
android {
    namespace 'dev.exactrpn'
    compileSdk 36
    defaultConfig {
        applicationId 'dev.exactrpn'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        minSdk 26
        targetSdk 36
        versionCode = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
        versionName = System.getenv('GITHUB_RUN_NUMBER') ? "0.1-dev.${System.getenv('GITHUB_RUN_NUMBER')}" : '0.1-dev'
    }
    signingConfigs {
        if (signingFile) {
            permanent {
                storeFile file(signingFile)
                storeType 'PKCS12'
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        if (signingFile) {
            debug { signingConfig signingConfigs.permanent }
            release { signingConfig signingConfigs.permanent }
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation project(':engine')
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}



// Generate offline documents from their authoritative sources. No runtime Markdown dependency.
def licenseAssets = layout.buildDirectory.dir('generated/licenseAssets')
def generateLicenseAssets = tasks.register('generateLicenseAssets') {
    inputs.files(rootProject.file('HELP.md'), rootProject.file('README.md'), rootProject.file('NOTICE'), rootProject.file('licenses/APACHE-2.0.txt'), rootProject.file('licenses/CR-COPYRIGHT.txt'))
    outputs.dir(licenseAssets)
    doLast {
        def escape = { text -> text.replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;') }
        def help = rootProject.file('HELP.md').getText('UTF-8')
        def embedded = help.replaceFirst('# Using Exact RPN', '### Using Exact RPN').replace('\n## ', '\n#### ')
        assert rootProject.file('README.md').getText('UTF-8').contains('<!-- BEGIN HELP -->\n' + embedded + '<!-- END HELP -->'): 'README Use section must match HELP.md'
        def html = help.readLines().collect { line ->
            def match = (line =~ /^(#{1,6}) (.*)$/)
            if (match.matches()) return '<h' + match[0][1].length() + '>' + escape(match[0][2]) + '</h' + match[0][1].length() + '>'
            '<p>' + escape(line).replaceAll(/\*\*(.+?)\*\*/, '<b>$1</b>').replaceAll(/`(.+?)`/, '<tt>$1</tt>') + '</p>'
        }.join('\n')
        def legal = '<h1>Licenses and source credits</h1>'
        ['Source credits':'NOTICE', 'Apache License 2.0':'licenses/APACHE-2.0.txt', 'Constructive-real library notices':'licenses/CR-COPYRIGHT.txt'].each { title, path ->
            legal += '<h2>' + title + '</h2><p>' + escape(rootProject.file(path).getText('UTF-8')).replace('\n', '<br>') + '</p>'
        }
        delete licenseAssets
        def directory = licenseAssets.get().asFile
        directory.mkdirs()
        ['help.html':html, 'licenses.html':legal].each { name, content ->
            new File(directory, name).setText(content, 'UTF-8')
        }
    }
}
android.sourceSets.main.assets.srcDir(licenseAssets)
tasks.named('preBuild').configure { dependsOn generateLicenseAssets }
